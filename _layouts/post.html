---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %d, %Y" }}
      {% if page.category %} &mdash; {{ page.category }}{% endif %}
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="post-footer">
    <a href="/analyses/">&larr; Back to all analyses</a>
  </div>
</article>
